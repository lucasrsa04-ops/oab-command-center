<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAB Command Center - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importando o cliente do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #fdfbf7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-800">OAB COMMAND CENTER</h1>
                <p class="text-slate-500 mt-1">Sua jornada rumo à aprovação | <span class="font-bold text-slate-800">DIA 31/90</span></p>
            </div>
            <button onclick="carregarDados()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                🔄 Atualizar Dados
            </button>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm">Progresso Geral</p>
                <p id="stat-progresso" class="text-3xl font-bold text-slate-800">Carregando...</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm">Questões Resolvidas</p>
                <p id="stat-questoes" class="text-3xl font-bold text-slate-800">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm">Próxima Prioridade</p>
                <p id="stat-prioridade" class="text-lg font-bold text-red-600 truncate">Processo Civil</p>
            </div>
        </div>

        <!-- Missão de Hoje -->
        <section class="bg-white p-6 rounded-2xl border-l-8 border-red-500 shadow-lg">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                🎯 MISSÃO DE HOJE
            </h2>
            
            <div id="lista-tarefas" class="space-y-6">
                <p class="text-slate-500">Conectando ao banco de dados...</p>
            </div>

            <button class="mt-8 w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition">
                COMEÇAR SESSÃO
            </button>
        </section>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE (Insira suas chaves aqui)
        const SUPABASE_URL = 'https://ktqpkmmsuximqanbujxv.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0cXBrbW1zdXhpbXFhbmJ1anh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjAwMzksImV4cCI6MjEwMjgzNjAzOX0.9wyplsX3BpejhaTFXykjkskpDx2FVyiektL-AfvxZrY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarDados() {
            try {
                // Buscando dados de progresso e tarefas do Supabase
                const { data, error } = await supabase.from('cronograma_dias').select('*');
                
                if (error) {
                    console.error(error);
                    document.getElementById('lista-tarefas').innerHTML = `<p class="text-red-500">Erro ao carregar dados. Verifique as credenciais do Supabase.</p>`;
                    return;
                }

                // Renderizando dinamicamente as tarefas
                let html = '';
                if(data && data.length > 0) {
                    data.forEach((item, index) => {
                        html += `
                            <div class="flex items-start">
                                <input type="checkbox" ${item.status === 'concluido' ? 'checked' : ''} class="mt-1.5 h-5 w-5 rounded border-gray-300 text-red-600 focus:ring-red-500">
                                <div class="ml-4">
                                    <p class="font-bold text-lg text-slate-800">Dia ${item.dia_numero} — Status: ${item.status}</p>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html = `<p class="text-slate-600">Nenhum cronograma cadastrado ainda. O banco está pronto para receber seus dados!</p>`;
                }
                
                document.getElementById('lista-tarefas').innerHTML = html;
                document.getElementById('stat-progresso').innerText = '10%';
            } catch (err) {
                console.error(err);
            }
        }

        carregarDados();
    </script>
</body>
</html>
